<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="Wayne Kiprotich" />
    <meta name="robots" content="index,follow,max-image-preview:large" />

    <!-- Per-page title, description, canonical and Open Graph tags are
         injected here at build time by scripts/prerender-meta.mjs, from the
         same <SEO> output React renders in the browser. -->
    <!--app-head-->

    <meta property="og:site_name" content="Wayne Kiprotich" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" href="/fonts/anybody.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Who runs this site and what the business offers. Static, so every
         crawler reads it without running JavaScript. Pages add their own
         (breadcrumbs, case studies, profile) on top. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://www.waynekiprotich.online/#person",
            "name": "Wayne Kiprotich",
            "jobTitle": "Full-Stack Software Engineer",
            "description": "Full-stack software engineer in Nairobi, Kenya, building web applications, REST APIs and data-driven dashboards.",
            "url": "https://www.waynekiprotich.online/",
            "image": "https://www.waynekiprotich.online/img/portrait-720.webp",
            "email": "mailto:waynekip123@icloud.com",
            "address": { "@type": "PostalAddress", "addressLocality": "Nairobi", "addressCountry": "KE" },
            "alumniOf": { "@type": "EducationalOrganization", "name": "Moringa School" },
            "knowsAbout": ["React", "TypeScript", "JavaScript", "Python", "Flask", "Node.js", "PostgreSQL", "Redis", "REST APIs", "Three.js", "M-Pesa integration", "Web performance", "SEO"],
            "sameAs": ["https://github.com/waynekiprotich", "https://linkedin.com/in/wayne-kiprotich-1a8ba6388"]
          },
          {
            "@type": "ProfessionalService",
            "@id": "https://www.waynekiprotich.online/#business",
            "name": "Wayne Kiprotich | Web Development",
            "description": "Website and web application development in Nairobi, Kenya: business websites, e-commerce with M-Pesa, full-stack applications, APIs, dashboards and maintenance.",
            "url": "https://www.waynekiprotich.online/",
            "image": "https://www.waynekiprotich.online/og-image.png",
            "email": "mailto:waynekip123@icloud.com",
            "founder": { "@id": "https://www.waynekiprotich.online/#person" },
            "address": { "@type": "PostalAddress", "addressLocality": "Nairobi", "addressCountry": "KE" },
            "areaServed": [
              { "@type": "City", "name": "Nairobi" },
              { "@type": "Country", "name": "Kenya" }
            ],
            "currenciesAccepted": "KES"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.waynekiprotich.online/#website",
            "name": "Wayne Kiprotich",
            "url": "https://www.waynekiprotich.online/",
            "inLanguage": "en-KE",
            "publisher": { "@id": "https://www.waynekiprotich.online/#person" }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
