<!doctype html>
<!--
  Source for public/og-image.png (1200x630). Render it with headless Chrome
  from the repository root:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
    --hide-scrollbars --window-size=1200,630 --screenshot=public/og-image.png \
    "file://$PWD/scripts/og-image.html"
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image</title>
    <style>
      @font-face {
        font-family: 'Anybody';
        src: url('../public/fonts/anybody.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 50% 150%;
      }
      @font-face {
        font-family: 'Instrument Sans';
        src: url('../public/fonts/instrument-sans.woff2') format('woff2');
        font-weight: 400 700;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0a0a;
        color: #f3eee4;
        font-family: 'Instrument Sans', sans-serif;
      }
      .wrap {
        position: relative;
        height: 100%;
        padding: 64px 72px;
        box-sizing: border-box;
        background: radial-gradient(55% 70% at 78% 45%, #1d1d1d, transparent 70%);
      }
      .tower {
        position: absolute;
        right: 40px;
        top: 70px;
        width: 520px;
        height: 360px;
        perspective: 1400px;
      }
      .tower > div {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform: rotateX(58deg) rotateZ(-38deg);
      }
      .plate {
        position: absolute;
        inset: 0;
        border-radius: 24px;
        border: 2px solid rgba(243, 238, 228, 0.3);
        background: linear-gradient(135deg, rgba(40, 40, 40, 0.95), rgba(14, 14, 14, 0.9));
        box-shadow: 0 50px 90px -30px rgba(0, 0, 0, 0.7);
      }
      .p1 { transform: translateZ(-110px); background-image: radial-gradient(circle, rgba(189,185,176,.7) 2px, transparent 2.5px), linear-gradient(135deg, rgba(40,40,40,.95), rgba(14,14,14,.9)); background-size: 26px 26px, auto; }
      .p2 { transform: translateZ(0); background-image: linear-gradient(90deg, transparent 49.6%, rgba(212,175,55,.6) 50%, transparent 50.4%), linear-gradient(135deg, rgba(40,40,40,.95), rgba(14,14,14,.9)); }
      .p3 { transform: translateZ(110px); border-color: rgba(212, 175, 55, 0.85); }
      .p3::before { content: ''; position: absolute; left: 10%; top: 14%; width: 62%; height: 12%; border-radius: 10px; background: rgba(243,238,228,.9); }
      .p3::after { content: ''; position: absolute; left: 10%; top: 60%; width: 28%; height: 14%; border-radius: 99px; background: #d4af37; }
      .name {
        position: absolute;
        left: 72px;
        bottom: 150px;
        margin: 0;
        font-family: 'Anybody', sans-serif;
        font-weight: 820;
        font-stretch: 112%;
        font-size: 118px;
        line-height: 0.86;
        letter-spacing: -0.02em;
      }
      .role {
        position: absolute;
        left: 72px;
        bottom: 72px;
        margin: 0;
        font-size: 30px;
        color: #a8a59e;
      }
      .role b { color: #d4af37; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="tower"><div><div class="plate p1"></div><div class="plate p2"></div><div class="plate p3"></div></div></div>
      <h1 class="name">Wayne<br />Kiprotich</h1>
      <p class="role"><b>Full-stack software engineer</b> in Nairobi, Kenya</p>
    </div>
  </body>
</html>
